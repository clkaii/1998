<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>靜好時光 ｜ 系統登入</title>
  <!-- 引入 Google Fonts: Noto Serif TC (襯線字體，增加文青感) 與 Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables: 文青大地色系配色 */
    :root {
      --bg-color: #f7f5f0;            /* 溫潤米白底色 */
      --card-bg: #ffffff;            /* 純白卡片背景 */
      --text-main: #3a3535;          /* 深暖灰文字 */
      --text-muted: #8c857b;         /* 淺暖灰說明字 */
      --primary: #7c6853;            /* 大地栗棕主色 */
      --primary-hover: #5c4c3c;      /* 深栗棕 */
      --border-color: #e2ded4;       /* 柔和細邊框 */
      --focus-ring: #c4b69c;         /* 聚焦環線色 */
      --error-color: #b85b56;        /* 莫蘭迪紅 (錯誤提示) */
      --font-serif: 'Noto Serif TC', serif;
      --font-sans: 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* 背景紋理感 */
      background-image: radial-gradient(#e5dfd3 0.8px, transparent 0.8px);
      background-size: 16px 16px;
    }

    /* 文青風卡片容器 */
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 48px 40px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(124, 104, 83, 0.05);
      transition: all 0.3s ease;
    }

    /* 頁頭標題 */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header .subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .header h1 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.05em;
    }

    .divider {
      width: 30px;
      height: 1px;
      background-color: var(--primary);
      margin: 16px auto 0;
      opacity: 0.6;
    }

    /* 表單元件 */
    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }

    .form-group label .required {
      color: var(--error-color);
      margin-left: 4px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: var(--font-sans);
      color: var(--text-main);
      background-color: #faf9f6;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="text"]::placeholder {
      color: #b5afLine;
      font-weight: 300;
    }

    input[type="text"]:focus {
      background-color: #ffffff;
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 3px rgba(196, 182, 156, 0.2);
    }

    /* 錯誤訊息提示 */
    .error-msg {
      font-size: 0.8rem;
      color: var(--error-color);
      margin-top: 6px;
      display: none;
      letter-spacing: 0.02em;
    }

    /* 按鈕樣式 */
    .btn-submit {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: var(--font-serif);
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(124, 104, 83, 0.15);
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(124, 104, 83, 0.2);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* 頁尾小字 */
    .footer-text {
      text-align: center;
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* 頁面切換效果 (下一頁示範) */
    .page {
      display: none;
    }
    .page.active {
      display: block;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 第一頁：首頁 / 驗證頁 -->
  <div id="page-home" class="card page active">
    <div class="header">
      <div class="subtitle">Welcome</div>
      <h1>身份資訊確認</h1>
      <div class="divider"></div>
    </div>

    <form id="loginForm" onsubmit="handleNext(event)">
      <!-- 姓名欄位 -->
      <div class="form-group">
        <label for="userName">姓名 <span class="required">*</span></label>
        <div class="input-wrapper">
          <input type="text" id="userName" placeholder="請輸入您的姓名" autocomplete="off">
        </div>
        <div id="nameError" class="error-msg">請輸入姓名</div>
      </div>

      <!-- 通訊處欄位 -->
      <div class="form-group">
        <label for="officeLocation">通訊處 <span class="required">*</span></label>
        <div class="input-wrapper">
          <input type="text" id="officeLocation" placeholder="請輸入通訊處名稱" autocomplete="off">
        </div>
        <div id="officeError" class="error-msg">請輸入有效的通訊處名稱</div>
      </div>

      <!-- 下一步按鈕 -->
      <button type="submit" class="btn-submit">下一步</button>
    </form>

    <div class="footer-text">― 擇一處靜好 ‧ 莫負時光 ―</div>
  </div>

  <!-- 第二頁：驗證成功後的內容 (示意) -->
  <div id="page-next" class="card page">
    <div class="header">
      <div class="subtitle">System</div>
      <h1 id="welcomeTitle">歡迎進頁</h1>
      <div class="divider"></div>
    </div>
    
    <p style="text-align: center; line-height: 1.8; color: var(--text-main); font-size: 0.95rem;">
      驗證成功！<br>
      您已順利進入下一步系統頁面。
    </p>

    <button type="button" class="btn-submit" style="margin-top: 32px;" onclick="goBack()">返回首頁</button>
  </div>

  <script>
    // 允許通過的通訊處清單
    const validOffices = [
      "威力", "玉山", "北二直轄一", "北二直轄", "昊陽", 
      "众山", "誠山", "華山", "昕立", "駿廷", 
      "駿山", "駿鋮", "雙贏", "仁愛", "鴻山", 
      "展毓", "臻觀", "宏國", "宏觀", "凌山", 
      "崧峰", "忠信", "敦煌", "慶昇", "東山", "洽山"
    ];

    function handleNext(event) {
      event.preventDefault(); // 阻擋表單預設提交

      const nameInput = document.getElementById('userName');
      const officeInput = document.getElementById('officeLocation');
      
      const nameError = document.getElementById('nameError');
      const officeError = document.getElementById('officeError');

      const nameVal = nameInput.value.trim();
      const officeVal = officeInput.value.trim();

      let isValid = true;

      // 驗證姓名
      if (!nameVal) {
        nameError.style.display = 'block';
        nameInput.style.borderColor = 'var(--error-color)';
        isValid = false;
      } else {
        nameError.style.display = 'none';
        nameInput.style.borderColor = 'var(--border-color)';
      }

      // 驗證通訊處 (必須在指定的 validOffices 陣列中)
      if (!officeVal) {
        officeError.textContent = '請輸入通訊處';
        officeError.style.display = 'block';
        officeInput.style.borderColor = 'var(--error-color)';
        isValid = false;
      } else if (!validOffices.includes(officeVal)) {
        officeError.textContent = '非指定的通訊處，無法進行下一步';
        officeError.style.display = 'block';
        officeInput.style.borderColor = 'var(--error-color)';
        isValid = false;
      } else {
        officeError.style.display = 'none';
        officeInput.style.borderColor = 'var(--border-color)';
      }

      // 若通過驗證，進入下一個頁面
      if (isValid) {
        document.getElementById('welcomeTitle').textContent = `你好，${nameVal}`;
        document.getElementById('page-home').classList.remove('active');
        document.getElementById('page-next').classList.add('active');
      }
    }

    // 返回首頁功能
    function goBack() {
      document.getElementById('page-next').classList.remove('active');
      document.getElementById('page-home').classList.add('active');
    }
  </script>
</body>
</html>
